<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title> Iron Comments </title>
    
    <link rel="stylesheet" type="text/css" href="./styles/style.css">
</head>
<body>

    <div>
    <fieldset>
        
    <form action="" method="post" class="form-container">
        <label for="Name">Your Name:</label>
        <br>
        <input type="text" name="username" id="username" placeholder="Name" class="inputype"></input>
        <br>
        <label for="Email">Your email:</label>
        <br>
        <input type="email" name="email" id="email" placeholder="Email" class="inputype"></input>
        <br>
    
        <label for="Comment">Comment:</label>
        <br>
        <textarea id="comment" name="comment" rows="8" cols="33" class="textarea">
            
        </textarea>
        <br>
        
        <label for="checkbox" name="subscribe" value="subscribe" class="cb-position"></label>
        <input type="checkbox" name="subscribe" value="subscribe" class="cb-style">Receive email updates?</input>
        <br>
        <button class="estilos-boton">Submit</button>
    </form>
    </fieldset>
</div>

</body>
</html>
